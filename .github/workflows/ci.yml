name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources && sudo apt-get update && sudo apt-get install -y clang-format
      - name: C++ format
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python format and lint
        run: |
          pip install ruff
          ruff check python
          ruff format --check python

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pytest (offline) and reference tables
        run: |
          pip install pytest numpy scipy jsonschema
          pytest -q
          python python/gen_gk_reference.py "$RUNNER_TEMP/gk.csv"
          python python/compare_csv.py "$RUNNER_TEMP/gk.csv" tests/validation/data/gk_reference.csv

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cxx: g++-13
            cc: gcc-13
            packages: g++-13
          - cxx: g++-14
            cc: gcc-14
            packages: g++-14
          - cxx: clang++-17
            cc: clang-17
            packages: clang-17
          - cxx: clang++-18
            cc: clang-18
            packages: clang-18
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources && sudo apt-get update && sudo apt-get install -y cmake ninja-build ${{ matrix.packages }}
      - name: Configure, build, test (release)
        run: |
          cmake --preset release
          cmake --build --preset release
          ctest --preset release --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan-ubsan, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources && sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: ${{ matrix.preset }}
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}
          ctest --preset ${{ matrix.preset }} --output-on-failure

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources && sudo apt-get update && sudo apt-get install -y cmake ninja-build clang-tidy g++
      - name: Configure debug (compile_commands.json) and generate build_info.hpp
        # apps/lib includes build_info.hpp, which is written at build time; without this step
        # clang-tidy stops with "'build_info.hpp' file not found".
        run: |
          cmake --preset debug
          cmake --build build/debug --target fxval_build_info
      - name: clang-tidy on library sources
        run: clang-tidy -p build/debug --quiet src/*.cpp apps/lib/*.cpp apps/price/main.cpp

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources && sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ gcovr
      - name: Coverage build and tests
        run: |
          cmake --preset coverage
          cmake --build --preset coverage
          ctest --preset coverage --output-on-failure
      - name: Enforce line coverage on src/
        run: |
          gcovr --filter 'src/' --fail-under-line 85 --print-summary \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file

  install-consume:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources && sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Install fxval and build examples/consumer
        run: |
          cmake --preset release
          cmake --build --preset release
          cmake --install build/release --prefix "$HOME/fxval-install"
          cmake -S examples/consumer -B build/consumer -DCMAKE_PREFIX_PATH="$HOME/fxval-install"
          cmake --build build/consumer
          ./build/consumer/consumer
          "$HOME/fxval-install/bin/fxval-price" --config configs/examples/gk_vanillas.json --quiet > /dev/null

  fuzz:
    # libFuzzer needs clang and its runtime. The deterministic replay of the same targets already
    # runs inside ctest in every job above; this job adds coverage-guided search on top of it.
    runs-on: ubuntu-24.04
    env:
      FUZZ_SECONDS: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources && sudo apt-get update && sudo apt-get install -y cmake ninja-build clang-18 libclang-rt-18-dev
      - name: Build the fuzz targets (whole library instrumented)
        run: |
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++-18 -DFXVAL_BUILD_FUZZERS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-omit-frame-pointer"
          cmake --build build/fuzz --target fxval_fuzz_vanilla fxval_fuzz_barrier fxval_fuzz_delta \
            fxval_fuzz_risk fxval_fuzz_credit fxval_fuzz_sha256 fxval_fuzz_price_config
      - name: Run each target on its corpus and regressions
        run: scripts/run_fuzzers.sh build/fuzz/tests "$FUZZ_SECONDS"
      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/fuzz/fuzz-artifacts/

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image (compiles and runs tests)
        run: docker build -t fxval .
