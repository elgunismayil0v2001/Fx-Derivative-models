name: Nightly

# Slow checks that do not belong in every push: longer fuzzing and the mutation check.
# Run by hand from the Actions tab (workflow_dispatch) as well.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  fuzz-long:
    runs-on: ubuntu-24.04
    env:
      FUZZ_SECONDS: 900
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources && sudo apt-get update && sudo apt-get install -y cmake ninja-build clang-18 libclang-rt-18-dev
      - name: Build the fuzz targets
        run: |
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++-18 -DFXVAL_BUILD_FUZZERS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-omit-frame-pointer"
          cmake --build build/fuzz --target fxval_fuzz_vanilla fxval_fuzz_barrier fxval_fuzz_delta \
            fxval_fuzz_risk fxval_fuzz_credit fxval_fuzz_sha256 fxval_fuzz_price_config
      - name: Fuzz (15 minutes per target)
        run: scripts/run_fuzzers.sh build/fuzz/tests "$FUZZ_SECONDS"
      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/fuzz/fuzz-artifacts/

  mutation:
    # Plants the recorded changes one at a time and fails if any test suite run does not notice.
    # A survivor means a gap in the tests; a stale pattern means the manifest needs updating.
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources && sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mutation check
        run: python3 scripts/mutation_check.py scripts/mutants/*.json --jobs 4 | tee mutation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-log
          path: mutation.log
